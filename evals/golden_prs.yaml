# M9 — Golden PR dataset for RAG evaluation
#
# Starter set: 10 hand-labelled PRs covering the most important finding
# categories.  Each entry is intentionally self-contained (no live DB needed)
# so the eval harness can run in offline mode for CI.
#
# Expand this file toward the target of ~50 entries by adding real PRs from
# your repositories once the eval infrastructure is in place.
#
# Schema:
#   id:               unique identifier (used in CSV output)
#   title:            PR title
#   description:      PR body (can be empty)
#   files[]:
#     filename:       relative file path
#     patch:          unified diff (+ lines are additions, - are removals)
#   expected_findings[]:
#     file:           filename suffix that must appear in the finding
#     line:           expected line number (matched with ±5 tolerance)
#     category:       security | bug | performance | quality | testing
#     severity:       critical | high | medium | low
#     must_mention:   list of keywords that must appear in the description
#   graphrag_context:
#     entities[]:     graph entities available for citation
#     similar_code[]: vector-search results

prs:

  # ── PR-001: SQL injection ─────────────────────────────────────────────────
  - id: pr-001
    title: "Add user search endpoint"
    description: "Adds a /users/search route that queries by username."
    files:
      - filename: src/routes/users.py
        patch: |
          @@ -0,0 +1,12 @@
          +from flask import request, g
          +
          +@app.route("/users/search")
          +def search_users():
          +    username = request.args.get("username", "")
          +    query = f"SELECT * FROM users WHERE username = '{username}'"
          +    results = g.db.execute(query).fetchall()
          +    return jsonify([dict(r) for r in results])
    expected_findings:
      - file: users.py
        line: 6
        category: security
        severity: critical
        must_mention:
          - sql injection
    graphrag_context:
      entities:
        - name: search_users
          file: src/routes/users.py
          type: function
          code: |
            def search_users():
                username = request.args.get("username", "")
                query = f"SELECT * FROM users WHERE username = '{username}'"
                results = g.db.execute(query).fetchall()
                return jsonify([dict(r) for r in results])
      similar_code:
        - file: src/routes/products.py
          line: 34
          snippet: |
            query = "SELECT * FROM products WHERE name = ?"
            db.execute(query, [name])

