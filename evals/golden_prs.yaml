  # ── PR-008: Empty except swallowing exceptions ─────────────────────────────
  - id: pr-008
    title: "Retry failed webhook deliveries"
    description: "Adds a background job that retries failed webhook sends."
    files:
      - filename: src/jobs/webhook_retry.py
        patch: |
          @@ -0,0 +1,12 @@
          +import requests
          +
          +def retry_webhook(url, payload, max_attempts=3):
          +    for attempt in range(max_attempts):
          +        try:
          +            resp = requests.post(url, json=payload, timeout=5)
          +            if resp.status_code == 200:
          +                return True
          +        except:
          +            pass
          +    return False
    expected_findings:
      - file: webhook_retry.py
        line: 9
        category: bug
        severity: medium
        must_mention:
          - except
    graphrag_context:
      entities:
        - name: retry_webhook
          file: src/jobs/webhook_retry.py
          type: function
          code: |
            def retry_webhook(url, payload, max_attempts=3):
                for attempt in range(max_attempts):
                    try:
                        resp = requests.post(url, json=payload, timeout=5)
                        if resp.status_code == 200:
                            return True
                    except:
                        pass
      similar_code: []

